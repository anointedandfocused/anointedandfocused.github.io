---
layout: default
---
{%- if page.hero -%}
{% include hero.html %}
{%- endif -%}
<div class="wrap wrap--about">
  {%- unless page.hero -%}
  <header class="page-header">
    <h1 class="page-title">{{ page.title }}</h1>
  </header>
  {%- endunless -%}
  <div class="page-content{% if page.hero %} page-content--after-hero{% endif %}">
    {{ content }}
  </div>
</div>
