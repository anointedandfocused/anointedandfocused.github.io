{%- assign share_url = page.url | absolute_url | url_encode -%}
{%- assign share_title = page.title | url_encode | replace: '+', '%20' -%}
<div class="share">
  <span class="share-label">Share this post</span>
  <ul>
    <li><a href="https://www.facebook.com/sharer/sharer.php?u={{ share_url }}" target="_blank" rel="noopener">Facebook</a></li>
    <li><a href="https://x.com/intent/post?url={{ share_url }}&amp;text={{ share_title }}" target="_blank" rel="noopener">X</a></li>
    <li><a href="mailto:?subject={{ share_title }}&amp;body={{ share_url }}">Email</a></li>
  </ul>
</div>
